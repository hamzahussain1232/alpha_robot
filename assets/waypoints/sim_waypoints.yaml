#
# Run script:
# ros2 run articubot_one xy_waypoint_follower.py --file sim_waypoints
#
# yaw is in radians, frame_id defaults to "map" if omitted.

waypoints:
  - x: -0.20
    y: 1.20
    yaw: -2.55
    frame_id: map

  - x: 1.00
    y: 1.20
    yaw: 0.00
    frame_id: map

  - x: 1.00
    y: 0.00
    yaw: -1.57
    frame_id: map

  - x: -0.20
    y: 0.00
    yaw: 3.14
    frame_id: map
