ddetect_ball:
  ros__parameters:
    x_min: 0
    x_max: 100
    y_min: 0
    y_max: 100
    
    # COLOR SETTINGS (RELAXED FOR SHADOWS)
    h_min: 0      
    h_max: 15     # Slightly wider to catch "Orange-Red"
    s_min: 65     # <--- CHANGED from 150 to 65 (Allows dark/dull red)
    s_max: 255
    v_min: 0      # Allows very dark (black-ish) red
    v_max: 255

    # SIZE SETTINGS (CRITICAL FOR BIG CYLINDER)
    sz_min: 0
    sz_max: 100   # <--- Ensure this is 100 (Not 20!) # <--- CRITICAL FIX: Allow objects up to 100% size
detect_ball_3d:
  ros__parameters:
    h_fov: 1.047
    ball_radius: 0.2
    camera_frame: "camera_link_optical"

follow_ball:
  ros__parameters:
    rcv_timeout_secs: 1.0
    angular_chase_multiplier: 0.7
    forward_chase_speed: 0.1
    search_angular_speed: 0.5
    max_size_thresh: 0.5
    filter_value: 0.9