slam_toolbox:
  ros__parameters:

    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Robot frames and LiDAR topic
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # Real-time mapping behavior
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 0.30
    minimum_time_interval: 0.15
    transform_timeout: 0.30
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true
    scan_queue_size: 1

    # Indoor LiDAR map
    resolution: 0.05
    max_laser_range: 5.5

    # Fast but stable scan insertion
    use_scan_matching: true
    use_scan_barycenter: false
    minimum_travel_distance: 0.07
    minimum_travel_heading: 0.07

    # Local scan matching
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 4.0
    link_match_minimum_response_fine: 0.15
    link_scan_maximum_distance: 1.0

    # Keep disabled until wheel odometry is calibrated.
    # This avoids large map-wide corrections during first mapping tests.
    do_loop_closing: false
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlative scan matcher
    correlation_search_space_dimension: 0.60
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.10

    # Loop closure matcher values kept ready for later
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Penalties
    distance_variance_penalty: 0.50
    angle_variance_penalty: 1.00
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.90
    minimum_distance_penalty: 0.50
    use_response_expansion: true

    # Occupancy-grid filtering
    min_pass_through: 2
    occupancy_threshold: 0.10
