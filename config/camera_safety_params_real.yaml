camera_safety_node:
  ros__parameters:
    use_sim_time: false
    detections_topic: "/perception/detections"
    lock_topic: "pause_navigation"
    publish_rate_hz: 10.0
    min_score: 0.50
    # Keep empty to accept all detector labels as potential near obstacles.
    allowed_labels: []
    # Slightly conservative defaults for real camera jitter/noise.
    min_bbox_area_ratio: 0.032
    min_bbox_height_ratio: 0.22
    trigger_bottom_ratio: 0.62
    center_band_half_width: 0.42
    lock_hold_sec: 1.00
    detections_timeout_sec: 1.50

