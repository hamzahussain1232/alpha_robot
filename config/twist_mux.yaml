twist_mux:
  ros__parameters:
    use_stamped: true

    topics:
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 20

      voice:
        topic: voice_vel
        timeout: 0.5
        priority: 70

      joystick:
        topic: cmd_vel_joy
        timeout: 0.5
        priority: 80

      joy_stamped:
        topic: joy_vel
        timeout: 0.5
        priority: 80

      keyboard:
        topic: key_vel
        timeout: 0.5
        priority: 90

      web:
        topic: web_vel
        timeout: 0.5
        priority: 95

    locks:
      pause:
        topic: pause_navigation
        timeout: 0.0
        priority: 100

      joystick:
        topic: joy_priority
        timeout: 0.0
        priority: 100

      loop_closure:
        topic: stop_closing_loop
        timeout: 0.0
        priority: 200

      emergency_stop:
        topic: emergency_stop
        timeout: 0.0
        priority: 255
