### ekf_filter_node_odom (SIM + IMU yaw fusion) ###
ekf_filter_node_odom:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.25
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Use wheel odometry for pose and yaw, and IMU only for yaw-rate stabilization.
    # In this simulation the IMU absolute orientation can disagree with wheel odom,
    # which causes map smear during turns if we fuse both yaw pose sources.
    odom0: /diff_cont/odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
