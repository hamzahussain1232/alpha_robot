amcl:
  ros__parameters:
    use_sim_time: false

    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.20

    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"

    tf_broadcast: true
    transform_tolerance: 0.5

    min_particles: 300
    max_particles: 1000
    pf_err: 0.05
    pf_z: 0.99

    update_min_d: 0.04
    update_min_a: 0.04
    resample_interval: 1

    max_beams: 120
    laser_likelihood_max_dist: 3.0
    sigma_hit: 0.2
    z_hit: 0.8
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.10

    do_beamskip: false
    set_initial_pose: false
    save_pose_rate: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    enable_groot_monitoring: false

    navigators: ["navigate_to_pose", "navigate_through_poses"]

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0

    min_x_velocity_threshold: 0.005
    min_y_velocity_threshold: 0.005
    min_theta_velocity_threshold: 0.01

    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"

      # Full turning capability for your real robot.
      angular_dist_threshold: 0.10
      angular_disengage_threshold: 0.05
      forward_sampling_distance: 0.20
      rotate_to_heading_angular_vel: 1.70
      max_angular_accel: 34.0
      simulate_ahead_time: 0.50
      rotate_to_goal_heading: true
      closed_loop: false

      # Required STRING for ROS 2 Jazzy Rotation Shim.
      primary_controller: "dwb_core::DWBLocalPlanner"

      # DWB path-following controller.
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.06
      max_vel_y: 0.0
      max_vel_theta: 1.70

      min_speed_xy: 0.0
      max_speed_xy: 0.06
      min_speed_theta: 0.0

      acc_lim_x: 0.20
      acc_lim_y: 0.0
      acc_lim_theta: 34.0

      decel_lim_x: -0.30
      decel_lim_y: 0.0
      decel_lim_theta: -34.0

      vx_samples: 16
      vy_samples: 1
      vtheta_samples: 36

      sim_time: 1.20
      linear_granularity: 0.025
      angular_granularity: 0.025

      transform_tolerance: 0.30
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

      BaseObstacle.scale: 0.02
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 18.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 28.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 28.0
      RotateToGoal.slowing_factor: 1.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05

      update_frequency: 8.0
      publish_frequency: 4.0
      always_send_full_costmap: true
      transform_tolerance: 0.30

      robot_radius: 0.17
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link

      update_frequency: 2.0
      publish_frequency: 1.0
      always_send_full_costmap: true
      transform_tolerance: 0.50

      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.17

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.20
      use_astar: false
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 100
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    behavior_plugins: ["spin", "backup", "wait", "drive_on_heading"]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    wait:
      plugin: "nav2_behaviors::Wait"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    transform_tolerance: 0.30
    max_rotational_vel: 1.70
    min_rotational_vel: 1.65
    rotational_acc_lim: 6.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    odom_topic: /odom
    velocity_timeout: 1.0

    max_velocity: [0.06, 0.0, 1.70]
    min_velocity: [-0.04, 0.0, -1.70]

    max_accel: [0.20, 0.0, 6.0]
    max_decel: [-0.30, 0.0, -6.0]

    deadband_velocity: [0.0, 0.0, 0.0]
