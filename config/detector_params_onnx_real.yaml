object_detector_node:
  ros__parameters:
    use_sim_time: false
    image_topic: "/camera/image_raw"
    amcl_pose_topic: "/amcl_pose"
    detections_topic: "/perception/detections"
    status_topic: "/task/status"
    annotated_image_topic: "/perception/annotated_image"
    publish_annotated_image: false
    publish_annotated_image_compressed: true
    annotated_image_jpeg_quality: 65

    # Lightweight Pi-first detector profile using OpenCV DNN with an exported ONNX model.
    backend: "onnxruntime"
    model_path: "/home/hh89669411/ros2_ws/models/yolo11n.onnx"
    device: "cpu"
    onnx_input_width: 320
    onnx_input_height: 320
    nms_threshold: 0.45

    confidence_threshold: 0.45
    target_labels: ["cup", "bottle", "book", "cell phone", "remote", "medicine box", "pill"]
    max_objects: 12
    process_every_n_frames: 2
    publish_empty_detections: false

    enable_pose_estimation: true
    require_robot_pose_for_detections: true
    camera_hfov_deg: 62.0
    default_distance_m: 0.9
    label_distance_json: '{"cup":0.7,"bottle":0.8,"book":0.7,"remote":0.6,"cell phone":0.55,"medicine box":0.7,"pill":0.6}'
    class_aliases_json: '{"cup":["mug","coffee cup"],"medicine box":["medicine","pill box","med box"],"bottle":["water bottle"],"pill":["medicine","tablet","capsule"]}'
